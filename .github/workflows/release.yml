name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) does not match manifest.json version ($version)"
            exit 1
          fi

      - name: Generate release notes from commit log
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tags="$(git tag --sort=-v:refname)"
          prev_tag="$(echo "$tags" | awk -v t="$tag" 'found{print; exit} $0==t{found=1}')"
          range="$tag"
          [ -n "$prev_tag" ] && range="$prev_tag..$tag"
          {
            echo "notes<<NOTES_EOF"
            git log --pretty=format:'- %s' "$range" | grep -viE '^- bump version'
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            main.js manifest.json styles.css \
            --title "$tag" \
            --notes "${{ steps.notes.outputs.notes }}"
